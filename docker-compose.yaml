# The stack on the server. `utils/deploy.sh` copies this file to
# `<DEPLOY_DIR>/` and loads the image beside it, so the folders are:
#
#   <DEPLOY_DIR>/            this file, and its `.env`: required, even empty, since it is
#                            also the container's `env_file` (CSBWEB_PORT, optional)
#   <DEPLOY_DIR>/gamefiles/  the data sets and `swoosh/`, uploaded separately,
#                            and the folders of the sets players publish, written by the
#                            container (uid 1000), hence read-write
#   <DEPLOY_DIR>/stats/      stats.db, the statistics and the data sets (their rows written
#                            by hand, or published), which a deploy's `down` leaves alone
#   <DEPLOY_DIR>/files/      the files shared by link, served under `files/`, put there by
#                            hand; read-only in the container
#
# Compose v1 needs the `version` key; v2 ignores it, with a warning.
version: '3.8'
services:
  csbweb:
    image: csbweb:latest
    container_name: csbweb
    env_file: .env
    # Loopback only
    ports:
      - '127.0.0.1:${CSBWEB_PORT:-8085}:8085'
    volumes:
      - ./gamefiles:/data/gamefiles
      - ./stats:/data/stats
      - ./files:/data/files:ro
    # On a server other projects may share: what the container may take, and what it may do.
    # The server writes only to the mounted /data/gamefiles and /data/stats, so the rest is
    # read-only; it needs no capability, its port being above 1024 and its folders its
    # uid's; and nothing in it gains a privilege. `tools/check-image.sh` runs the image so.
    mem_limit: 512m
    pids_limit: 100
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # The server lets the requests in flight finish for 5 s, then closes the store.
    stop_grace_period: 10s
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8085/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

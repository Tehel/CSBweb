# The stack on the VPS. `utils/deploy.sh` copies this file to
# `<DEPLOY_DIR>/` and loads the image beside it, so the folders are:
#
#   <DEPLOY_DIR>/        this file, and an optional `.env` with CSBWEB_PORT
#   <DEPLOY_DIR>/gamefiles/  the data sets, `swoosh/` and `manifest.json`, uploaded separately
#   <DEPLOY_DIR>/stats/      stats.db, which a deploy's `down` leaves alone
#
# The VPS runs Compose v1, hence the `version` key.
version: '3.8'
services:
  csbweb:
    image: csbweb:latest
    container_name: csbweb
    env_file: .env
    # Loopback only
    ports:
      - '127.0.0.1:${CSBWEB_PORT:-8085}:8085'
    volumes:
      - ./gamefiles:/data/gamefiles:ro
      - ./stats:/data/stats
    restart: unless-stopped
    # The server lets the requests in flight finish for 5 s, then closes the store.
    stop_grace_period: 10s
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8085/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

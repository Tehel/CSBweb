<!DOCTYPE html>
<html lang="en">
<head>
    <title>Dungeon Master Web</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dungeon Master Web - Classic dungeon crawler in your browser">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #app {
            display: flex;
            flex-direction: row;
        }
        #game {
            /* text-align: center; */
            background-color: #222;
        }
        /* Scale the full screen canvas using CSS to get the original 4/3 ratio (rectangular pixels)
           Internal resolution: 320×200, external 960×720 */
        .screen {
            /* width: 640px;
            height: 480px; */
            width: 960px;
            /* height: 720px; */
            height: 600px;
            image-rendering: pixelated;
            cursor: none;
        }
        #side {
            display: flex;
            flex-direction: column;
            margin-left: 5px;
            background-color: #444;
        }
        #settings {
            background-color: #666;
        }
        #map {
            background-color: #888;
        }
        #log {
            background-color: #999;
            /* margin-top: 20px;
            text-align: left;
            max-width: 640px;
            font-size: 12px; */
        }
        #hover {
            background-color: #aaa;
            max-height: 150px;
            overflow-y: scroll;
        }

        #map-canvas {
            background-color: black;
        }

        button {
            /* background-color: #444; */
            /* color: #fff; */
            /* border: 2px solid #666; */
            padding: 3px 5px;
            margin: 3px;
            cursor: pointer;
            /* font-family: inherit; */
            /* font-size: 16px; */
        }

        button:hover {
            background-color: #555;
        }

        button:active {
            background-color: #333;
        }

        .toggle-button {
            background-color: #666;
            border: 2px solid #888;
            color: #fff;
            box-shadow: 0 2px 0 #333;
        }

        .toggle-button.is-pressed {
            background-color: #555;
            border-color: #444;
            box-shadow: inset 0 2px 0 #222;
        }

        #sound-volume {
            width: 120px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="game">
            <canvas id="game-canvas" width="320" height="200" class="screen"></canvas>
        </div>
        <div id="side">
            <div id="settings">
                <button id="btn-qsave">Quick Save (F5)</button>
                <button id="btn-qload">Quick Load (F9)</button><br>
                <button id="btn-smooth" class="toggle-button">Smooth</button>
                <button id="btn-crt" class="toggle-button">CRT</button>
                <button id="btn-sound" class="toggle-button is-pressed">Sound</button>
                <input id="sound-volume" type="range" min="0" max="100" value="80">
                <br>
                <button id="btn-map" class="toggle-button is-pressed">Map</button>
                <button id="btn-log" class="toggle-button">Log</button>
                <button id="btn-hover" class="toggle-button">Hover</button>
                <button id="btn-debug" class="toggle-button">Debug</button>
            </div>
            <div id="map">
                <canvas id="map-canvas" width="360" height="360"></canvas>
            </div>
            <div id="log">...log...</div>
            <div id="hover">...hover...</div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>

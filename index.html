<!DOCTYPE html>
<html lang="en">
<head>
    <title>Dungeon Master Web</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dungeon Master Web - Classic dungeon crawler in your browser">
    <link rel="icon" type="image/x-icon" href="./src/assets/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        #app {
            display: flex;
            flex-direction: row;
        }
        /* The game canvas and the CRT effect's share one cell, the effect's over the
           game's, at one size: `.screen`'s, which fullscreen sets on `#game`
           (src/lib/fullscreen.ts), centred on black. */
        #game {
            display: grid;
            background-color: #222;
        }
        #game > canvas {
            grid-area: 1 / 1;
        }
        #game:fullscreen {
            place-content: center;
            background-color: #000;
        }
        /* The installed game (`src/assets/manifest.webmanifest`, linked here by vite.config.mts):
           its window is the game's, `#game` fills it as it fills the screen in fullscreen,
           and the screen is sized in it the same way (src/lib/fullscreen.ts). */
        @media (display-mode: fullscreen), (display-mode: standalone) {
            body:not(.welcome) {
                padding: 0;
            }
            #game {
                width: 100vw;
                height: 100vh;
                place-content: center;
                background-color: #000;
            }
        }
        /* The CRT effect's canvas (`createCrtEffect`, src/lib/crt.ts) lets every click and
           move through to the game canvas. */
        #crt-canvas {
            pointer-events: none;
        }
        /* The 320x200 screen, three screen pixels to one, or in fullscreen the largest
           whole multiple that fits, at the shape DISPLAY's ASPECT RATIO gives it
           (src/lib/fullscreen.ts). */
        .screen {
            width: var(--screen-width, 960px);
            height: var(--screen-height, 600px);
            image-rendering: pixelated;
            cursor: none;
            /* A touch is the game's, not a scroll's or a zoom's (`bindCanvasEvents`,
               src/ui/events.ts), nor a long press's callout or selection. */
            touch-action: none;
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="game">
            <canvas id="game-canvas" width="320" height="200" class="screen"></canvas>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>

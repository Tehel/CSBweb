<!DOCTYPE html>
<html lang="en">
<head>
    <title>Dungeon Master Web</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dungeon Master Web - Classic dungeon crawler in your browser">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="src/lib/glfx-latest-minified.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #app {
            display: flex;
            flex-direction: row;
        }
        #game {
            /* text-align: center; */
            background-color: #222;
        }
        /* Scale the full screen canvas using CSS to get the original 4/3 ratio (rectangular pixels)
           Internal resolution: 320×200, external 960×720 */
        .screen {
            /* width: 640px;
            height: 480px; */
            width: 960px;
            height: 720px;
            image-rendering: pixelated;
        }
        #side {
            display: flex;
            flex-direction: column;
            margin-left: 5px;
            background-color: #444;
        }
        #settings {
            background-color: #666;
        }
        #map {
            background-color: #888;
        }
        #debug {
            background-color: #999;
            /* margin-top: 20px;
            text-align: left;
            max-width: 640px;
            font-size: 12px; */
        }
        #hover {
            background-color: #aaa;
        }

        #map-canvas {
            background-color: black;
        }

        button {
            /* background-color: #444; */
            /* color: #fff; */
            /* border: 2px solid #666; */
            padding: 3px 5px;
            margin: 3px;
            cursor: pointer;
            /* font-family: inherit; */
            /* font-size: 16px; */
        }

        button:hover {
            background-color: #555;
        }

        button:active {
            background-color: #333;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="game">
            <canvas id="game-canvas" width="320" height="200" class="screen"></canvas>
        </div>
        <div id="side">
            <div id="settings">
                <button id="btn-qsave">Quick Save (F5)</button>
                <button id="btn-qload">Quick Load (F9)</button><br>
                <button id="btn-map">Map</button>
                <button id="btn-smooth">Smooth</button>
                <button id="btn-log">Log</button>
                <button id="btn-hover">Hover</button>
            </div>
            <div id="map">
                <canvas id="map-canvas" width="360" height="360"></canvas>
            </div>
            <div id="debug">...debug...</div>
            <div id="hover">...hover...</div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
